[app]
name = "Zero Caption"
workspace_root = "data"
log_level = "INFO"
language = "zh-CN"
theme = "system"

[ui]
default_page = "projects"

[engine.asr]
provider = "faster-whisper"
model_name = "auto"
device = "auto"
compute_type = "auto"
bundled_models = ["small", "medium"]
allow_cpu_fallback = true

[engine.translation]
provider = "openai-compatible"
base_url = ""
model = ""
api_key = ""
api_key_env = "OPENAI_API_KEY"
system_prompt = "你是一名专业字幕翻译器。请忠实、自然、简洁地翻译字幕，不添加解释。调用方每次只提供一条字幕；请只返回 JSON 数组，数组中包含一个对象，原样保留 id，并在 text 字段中给出译文。不要使用 Markdown 代码块。"
timeout_seconds = 60.0
max_retries = 2
max_batch_segments = 1
max_batch_characters = 4000

[engine.export]
default_mode = "soft_subtitle"

[runtime]
ffmpeg_path = "resources/bin/ffmpeg/ffmpeg.exe"
ffprobe_path = "resources/bin/ffmpeg/ffprobe.exe"
model_cache_dir = "data/models"

[task]
max_concurrency = 1
max_retries = 2

[subtitle]
source_language = "auto"
target_language = "zh-CN"

[cache]
enabled = true
reuse_audio = true
reuse_transcript = true
